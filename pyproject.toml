[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-default-mlops"
version = "0.1.0"
description = "Предсказание дефолта клиентов кредитных карт"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.1.4",
    "xlrd==2.0.1",
    "great-expectations==1.3.8",
    "scikit-learn==1.5.2",
]

[project.optional-dependencies]
dev = ["black==24.10.0", "flake8==7.1.1", "pytest==8.3.3"]
eda = ["matplotlib==3.8.0", "jupyterlab>=4,<5"]
experiments = ["catboost==1.2.8", "xgboost==2.1.4"]
training = [
    "catboost==1.2.8",
    "mlflow==2.22.2",
    "matplotlib==3.8.0",
    "dvc==3.59.2",
    "cryptography==44.0.3",
    "asyncssh==2.20.0",
    "pathspec==0.12.1",
]
api = ["catboost==1.2.8", "fastapi==0.115.12", "uvicorn==0.34.3", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
